[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "judgeaudit"
version = "0.1.0"
description = "Audit an LLM-as-judge for position and length bias before it decides a release."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "judgeaudit contributors" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "statsmodels>=0.14",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
judgeaudit = "judgeaudit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/judgeaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: calls a real OpenAI-compatible endpoint; needs JUDGEAUDIT_LIVE=1"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
